# PR と main への push で、ビルドとテストを回す(CLAUDE.md の「コミット前に build と test」を機械でも確かめる)
# 実データを使うテスト(HEISO_TEST_LOGS)と ffmpeg を使うテスト(HEISO_FFMPEG)は、環境変数が無いのでスキップされる
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build csharp/HEISO.slnx -c Release

      - name: Test
        run: dotnet test csharp/HEISO.slnx -c Release --no-build --logger "trx;LogFilePrefix=test" --results-directory TestResults

      # tools/dev は公開リポジトリに出さないので、無ければ飛ばす
      - uses: actions/setup-node@v4
        if: hashFiles('tools/dev/typecheck.mjs') != ''
        with:
          node-version: 22

      - name: JS test
        if: hashFiles('tools/dev/typecheck.mjs') != ''
        run: node tools/dev/frictioncircle.test.mjs

      # TypeScript は検査のときだけ一時フォルダへ入れる。リポジトリにも配布物にも入らない
      - name: JS type check
        if: hashFiles('tools/dev/typecheck.mjs') != ''
        run: |
          npm install --no-audit --no-fund --prefix "$env:RUNNER_TEMP\ts" typescript@6.0.3
          node tools/dev/typecheck.mjs "$env:RUNNER_TEMP\ts\node_modules\typescript\lib\typescript.js"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
