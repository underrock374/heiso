# PR と main への push で、ビルドとテストを回す(CLAUDE.md の「コミット前に build と test」を機械でも確かめる)
# 実データを使うテスト(HEISO_TEST_LOGS)と ffmpeg を使うテスト(HEISO_FFMPEG)は、環境変数が無いのでスキップされる
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build csharp/HEISO.slnx -c Release

      - name: Test
        run: dotnet test csharp/HEISO.slnx -c Release --no-build --logger "trx;LogFilePrefix=test" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
